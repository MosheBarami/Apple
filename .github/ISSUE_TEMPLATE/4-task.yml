name: Task
description: One milestone step to build.
title: "[M?] "
labels: [task]
body:
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [M5a UI, M5b Systems, M5c Props, M5d Zones, W Web rebuild, M6 Pricing, M7 Final proof, Ops]
    validations: { required: true }
  - type: input
    id: ref
    attributes:
      label: Plan reference
      placeholder: HANDOFF M5a 5.3 / WEB-REBUILD §4 step 2
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when (verifiable)
      placeholder: "- U01–U15 re-run reported\n- CI green"
    validations: { required: true }
