name: Capability gap
description: Something the agent cannot build, or builds badly, that a person would reasonably ask for.
labels: [capability-gap]
body:
  - type: markdown
    attributes:
      value: |
        File the GAP, not the one request that exposed it. If the fix would only help when a request mentions one particular subject, it is the wrong fix. This repository is public: no secrets or private place content.
  - type: textarea
    id: request
    attributes:
      label: The request that failed
      description: The exact words sent to the agent.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Single object
        - Silly request
        - Modify an existing build
        - Map
        - System (gameplay logic)
        - UI
        - Whole game
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What a good result looks like
      description: What a person would expect to see in Studio.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the agent did instead
  - type: textarea
    id: general
    attributes:
      label: The general capability that is missing
      description: Name it without the subject. Which other requests would hit the same wall?
