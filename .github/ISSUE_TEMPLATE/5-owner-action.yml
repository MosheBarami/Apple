name: Owner action
description: Something only the owner can do (mirrors planning/proof/BLOCKED.md).
title: "[Owner] "
labels: [owner-action]
assignees: [MosheBarami]
body:
  - type: input
    id: id
    attributes:
      label: BLOCKED id
      placeholder: X4 / N2 / N9
    validations: { required: true }
  - type: dropdown
    id: when
    attributes:
      label: Needed by
      options: [Now (blocks work), Before charging money, Before public launch, M7]
    validations: { required: true }
  - type: textarea
    id: clicks
    attributes:
      label: Exact steps, in plain words
      placeholder: "1. Open ...\n2. Click ...\n3. Tell Claude Code \"done\""
    validations: { required: true }
