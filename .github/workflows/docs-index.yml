name: docs-index

# Rebuilds the studpilot-docs D1 index (Roblox Creator Docs + Luau) weekly and loads it.
# Needs repository secrets CLOUDFLARE_API_TOKEN (D1 edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install index tooling
        run: npm install --no-audit --no-fund --no-package-lock
        working-directory: scripts/docs-index
      - name: Build SQL batches
        run: node scripts/docs-index/build.mjs
      - name: Upload to D1
        run: node scripts/docs-index/upload.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
