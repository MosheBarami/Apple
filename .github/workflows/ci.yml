name: CI

# Deterministic checks only.
#
# COST POLICY — read before adding a job.
# Nothing in this workflow may call a paid model provider. The eval RUNNERS
# (packages/evals/src/run.mjs, visual-bench.mjs, tasks-visual/grade-visual.mjs)
# spend real money against the worker's admin gateway and are therefore NEVER
# invoked here. `pnpm -r test` is safe and stays safe because every test that
# touches HTTP injects its own `fetchImpl` — verified, not assumed. If you add
# a test that makes a real network call, it does not belong in this workflow.
#
# No job in this file is given repository secrets. That is deliberate: a
# workflow with no credentials cannot leak them and cannot spend anything.

on:
  push:
    branches: [main]
  # EVERY pull request, whatever it targets.
  #
  # This was `branches: [main]`, which covered PR #1 only because PR #1 happens to
  # target main. A stacked PR — a product branch based on a feature branch, which is
  # the normal shape once one long-lived branch exists — would have silently run no
  # CI at all, and a PR that reported nothing looks identical to one that passed.
  #
  # Widening it is safe HERE specifically because this workflow cannot deploy and
  # cannot spend: no job in this file is given repository secrets, and no job has a
  # deploy step (see the cost policy above). Running it on a feature branch therefore
  # creates no production path. Do not add a deploy step to this file; if one is ever
  # needed it belongs in a separate workflow gated on `push: [main]`.
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.13.0'

jobs:
  # ---------------------------------------------------------------- checks --
  typecheck-and-test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Luau toolchain
        # Two consumers, both of which fail loudly rather than silently skip:
        #   luau-analyze — the eval selftest verifies its Luau grader against a real checker.
        #   luau         — runs the Crystal Canyon Luau specs and their mutation check.
        # Pinned upstream release, no third-party action.
        env:
          LUAU_VERSION: '0.663'
        run: |
          set -euo pipefail
          curl -fsSL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau-analyze" "$RUNNER_TEMP/luau/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
          echo "LUAU_CHECK_BIN=$RUNNER_TEMP/luau/luau-analyze" >> "$GITHUB_ENV"

      - name: Typecheck every package
        run: pnpm -r typecheck

      - name: Tests
        # Offline by construction. See the cost policy at the top of this file.
        run: pnpm -r test

  # ----------------------------------------------------------------- build --
  build:
    name: Build site and web
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        run: pnpm --filter @golem/site build

      - name: Build web app
        run: pnpm --filter @golem/web build

      - name: Internal links resolve
        # Nineteen pages that cross-reference each other, and a dead href is valid HTML —
        # the build succeeds and the 404 ships. 577 links today.
        run: node scripts/check-site-links.mjs

      - name: Published spark figures match what the worker charges
        # The pricing page stated Clay at 1 spark and 60 requests a free day. The worker
        # charges ceil(neurons / 30) and Clay measures 37-43, so it is 2 and 30. Stone
        # and Rune were right, which is what made it an arithmetic slip rather than a
        # different pricing model — and nothing connected the page to the arithmetic.
        run: node scripts/check-spark-figures.mjs

      - name: Heading hierarchy and landmarks
        # Structure is invisible until someone navigates by it. The landing shipped with
        # its three claims inside a <footer> and their titles as <span>, which looks
        # identical in a screenshot and gives a screen reader one stop for the page.
        run: node scripts/check-site-semantics.mjs

      - name: Landing payload budget
        # The root route is meant to be one viewport of HTML and CSS with no
        # JavaScript at all. This fails if that regresses, because a budget
        # nobody enforces is not a budget.
        run: node scripts/check-landing-budget.mjs

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
          retention-days: 7

  # ---------------------------------------------------------------- plugin --
  plugin:
    name: Build Studio plugin
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        # Pinned and fetched straight from the upstream release rather than via
        # a third-party action, so the plugin toolchain is one fewer supply
        # chain to trust.
        env:
          ROJO_VERSION: '7.7.0'
        run: |
          set -euo pipefail
          curl -fsSL -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -q rojo.zip -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Rojo version
        run: rojo --version

      - name: Build plugin
        run: rojo build apps/plugin/default.project.json --output golem-plugin.rbxm

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          #[[ NAMED SO NOBODY INSTALLS IT BY MISTAKE.
          #
          #   plugin-release.yml tells a human to download "the artifact" and drop the
          #   .rbxm into their local Plugins folder. THIS artifact is built from
          #   whatever a pull request contains, including a fork's, and now that every
          #   PR runs CI there are many more of them. It is a build check, not a
          #   release. The release artifact comes from plugin-release.yml, which is
          #   workflow_dispatch-only. ]]
          name: golem-plugin-pr-unverified
          path: golem-plugin.rbxm
          retention-days: 7

  # --------------------------------------------------------- static checks --
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Syntax-check eval scripts
        run: pnpm --filter @golem/evals check

      - name: Every package is reachable from `pnpm -r test`
        # apps/plugin shipped for the whole of Phase IV with no package.json, so the
        # canonical test command could not see 2,901 lines of load-bearing Luau. A
        # package pnpm cannot see produces no output, so nothing went red. This
        # derives the check from pnpm-workspace.yaml rather than a second list.
        run: node scripts/check-workspace-coverage.mjs

      - name: Formatting drift (report only)
        # PINNED. `prettier@3` resolves the newest 3.x from npm on every run, including
        # every fork PR — unpinned remote code execution, in a workflow whose other two
        # toolchain installs are deliberately version-pinned so the supply chain is one
        # fewer thing to trust. Same reasoning, same treatment.
        run: npx --yes prettier@3.4.2 --check "apps/**/*.{ts,tsx,css,astro}" || echo "::warning::prettier reported formatting drift"

  # ------------------------------------------------------------- security ---
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still a
          # leaked secret, and a shallow clone would not see it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Scan full history for secrets
        run: python3 scripts/secret-scan.py

      - name: Assert no environment files are tracked
        run: |
          set -euo pipefail
          for f in .env .env.local .dev.vars; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked by git"
              exit 1
            fi
          done
          echo "no tracked environment files"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Advisory: a new upstream advisory should not block an unrelated PR,
        # but it must be visible in the run summary.
        run: pnpm audit --audit-level moderate || echo "::warning::pnpm audit reported advisories"

  # ------------------------------------------------------------------ e2e ---
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm --filter @golem/site build

      - name: Smoke tests
        # Static preview of the built output. No worker, no Supabase, no
        # provider — so these cost nothing and cannot flake on a backend.
        run: pnpm exec playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
