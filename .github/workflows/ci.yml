name: CI

# Deterministic checks only.
#
# COST POLICY — read before adding a job.
# Nothing in this workflow may call a paid model provider. The eval RUNNERS
# (packages/evals/src/run.mjs, visual-bench.mjs, tasks-visual/grade-visual.mjs)
# spend real money against the worker's admin gateway and are therefore NEVER
# invoked here. `pnpm -r test` is safe and stays safe because every test that
# touches HTTP injects its own `fetchImpl` — verified, not assumed. If you add
# a test that makes a real network call, it does not belong in this workflow.
#
# No job in this file is given repository secrets. That is deliberate: a
# workflow with no credentials cannot leak them and cannot spend anything.

on:
  push:
    branches: [main]
    # Owner speed order (2026-10-06): a change to documents only runs no CI.
    paths-ignore: ['**/*.md', 'planning/**', 'docs/**']
  # EVERY pull request, whatever it targets.
  #
  # This was `branches: [main]`, which covered PR #1 only because PR #1 happens to
  # target main. A stacked PR — a product branch based on a feature branch, which is
  # the normal shape once one long-lived branch exists — would have silently run no
  # CI at all, and a PR that reported nothing looks identical to one that passed.
  #
  # Widening it is safe HERE specifically because this workflow cannot deploy and
  # cannot spend: no job in this file is given repository secrets, and no job has a
  # deploy step (see the cost policy above). Running it on a feature branch therefore
  # creates no production path. Do not add a deploy step to this file; if one is ever
  # needed it belongs in a separate workflow gated on `push: [main]`.
  pull_request:
    paths-ignore: ['**/*.md', 'planning/**', 'docs/**']
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 24 (LTS). The old-names guard compiles allowlist tokens with regex modifiers (`(?i:...)`), which
  # Node 22 does not support. On 26 the checker spawned by tests/check-escape-hatches.test.mjs hung
  # past its 300 s budget once in each of two CI runs (a different test each time), so not 26 yet.
  NODE_VERSION: '24'
  PNPM_VERSION: '11.13.0'

jobs:
  # ---------------------------------------------------------------- checks --
  tests:
    # Owner speed order (2026-10-06): CI under 3 minutes. The tests run in parallel shards; apps/site and apps/web are
    # not built or tested any more, nor packages/design, their design system (the web rebuild replaces all three).
    name: Tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: typecheck
            run: pnpm -r --filter '!@studpilot/site' --filter '!@studpilot/web' typecheck
          - part: worker 1/3
            run: cd apps/worker && node --test --test-shard=1/3
          - part: worker 2/3
            run: cd apps/worker && node --test --test-shard=2/3
          - part: worker 3/3
            run: cd apps/worker && node --test --test-shard=3/3
          - part: packages
            run: pnpm -r --filter '!@studpilot/site' --filter '!@studpilot/web' --filter '!@studpilot/worker' --filter '!@studpilot/design' test
          - part: root 1/3
            run: node --test --test-timeout=240000 --test-shard=1/3 tests/*.test.mjs
          - part: root 2/3
            run: node --test --test-timeout=240000 --test-shard=2/3 tests/*.test.mjs
          - part: root 3/3
            run: node --test --test-timeout=240000 --test-shard=3/3 tests/*.test.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Luau toolchain
        # luau-analyze parses the shipped Luau (blocks, components, the eval grader); luau runs the specs.
        env:
          LUAU_VERSION: '0.663'
        run: |
          set -euo pipefail
          curl -fsSL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau-analyze" "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
          echo "LUAU_CHECK_BIN=$RUNNER_TEMP/luau/luau-analyze" >> "$GITHUB_ENV"

      - name: ${{ matrix.part }}
        run: ${{ matrix.run }}

  typecheck-and-test:
    # The one name the branch ruleset requires (.github/rulesets/main.json): green only when every shard is.
    name: Typecheck and tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success

  plugin:
    name: Build and verify the Studio plugin (apps/studpilot-plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Luau toolchain
        # build.mjs parses every source with luau-analyze before it builds, and refuses to build
        # without it rather than skipping the parse. Same pinned release as the test job.
        env:
          LUAU_VERSION: '0.663'
        run: |
          set -euo pipefail
          curl -fsSL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau-analyze" "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Install Rojo
        # Pinned and fetched straight from the upstream release rather than via
        # a third-party action, so the plugin toolchain is one fewer supply
        # chain to trust.
        env:
          ROJO_VERSION: '7.7.0'
        run: |
          set -euo pipefail
          curl -fsSL -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -q rojo.zip -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Rojo version
        run: rojo --version

      - name: Build the plugin and verify the built bytes
        # One command, the same one a person runs locally and the one docs/PLUGIN-RELEASE.md names:
        # parse every source, refuse a require of a module that is not bundled, rojo build
        # apps/studpilot-plugin/default.project.json into release/studpilot-studio.rbxm, scan the artifact
        # for secrets (scripts/inspect-plugin-build.py), then read the BUILT bytes for every
        # capability the source claims (apps/studpilot-plugin/scripts/verify-artifact.py). The last
        # step is the one that was never run in CI: every test reads the .luau, and the legacy
        # artifact once shipped with zero GenerateModelAsync while its source had generation.
        # Any of the four failing fails this step.
        run: |
          set -euo pipefail
          node apps/studpilot-plugin/scripts/build.mjs
          ls -l apps/studpilot-plugin/release/studpilot-studio.rbxm
          sha256sum apps/studpilot-plugin/release/studpilot-studio.rbxm

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          #[[ NAMED SO NOBODY INSTALLS IT BY MISTAKE.
          #
          #   This artifact is built from whatever a pull request contains, including a
          #   fork's. It is a build check, not a release. Customers install the plugin
          #   from the Creator Store, and the release candidate comes from
          #   plugin-release.yml, which is workflow_dispatch-only. ]]
          name: studpilot-studio-pr-unverified
          path: apps/studpilot-plugin/release/studpilot-studio.rbxm
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------- static checks --
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Syntax-check eval scripts
        run: pnpm --filter @studpilot/evals check

      - name: Every package is reachable from `pnpm -r test`
        # apps/plugin shipped for the whole of Phase IV with no package.json, so the
        # canonical test command could not see 2,901 lines of load-bearing Luau. A
        # package pnpm cannot see produces no output, so nothing went red. This
        # derives the check from pnpm-workspace.yaml rather than a second list.
        run: node scripts/check-workspace-coverage.mjs

      - name: The product is called what it is called
        # THE REBRAND HAD NO ENFORCEMENT ANYWHERE UNTIL TONIGHT. check-rebrand.mjs was written,
        # was correct, and was invoked by no gate, no npm script and no job in this file — so its
        # exit code carried no weight and drift landed on 2026-09-19 with every check green. It is
        # the thing the owner has asked for more times than anything else in this repository.
        #
        # --offline ON PURPOSE: the full run fetches the live origin to date its capture, and a CI
        # job that needs the network goes red for reasons that are not about the code. The offline
        # half is deterministic and it is the half that catches source drift, which is what landed
        # unobserved. Its success line says "IN SOURCE … THE DEPLOYED SITE WAS NOT CHECKED", so a
        # green here cannot be read as a statement about production; the deployed half belongs on
        # the deploy path.
        run: node scripts/check-rebrand.mjs --offline

      - name: The former product names do not come back
        # Owner directive 2026-10-04: the product is StudPilot, and its former names (Apple, Golem) are gone from
        # every aspect of it. This is the guard (scripts/check-old-names.mjs): every tracked file's contents, binary
        # bytes and path names, against an exact-count allowlist (planning/rename-allowlist.txt) in which every
        # line has a reason and a removal condition. A new use fails; so does a line that matches nothing or whose
        # count is no longer exact. It needs only git and node, so it is deterministic and offline.
        # tests/check-old-names.test.mjs proves it can fail.
        run: node scripts/check-old-names.mjs

      - name: The offer holds together
        # scripts/check-offer.mjs: what a plan charges, what it grants, what that costs to serve and what the whole
        # service can deliver in a day must agree, and no page may state a quota (for its period and its plan) or
        # a monthly price that no plan has, or a contractual term ("free forever"). It was run only by its own test
        # file, which accepted an INCOHERENT verdict, so nothing in CI could go red for a wrong figure on a page.
        # It reads tracked files and the shared tables only: deterministic and offline. tests/check-offer.test.mjs
        # hands each rule an input that breaks it, to prove it can fail.
        run: node scripts/check-offer.mjs

      - name: Every script CI invokes exists
        # This checker was written for the rename that missed .github and left main red for five
        # days (04d3800, runs 34934918501 / 35002022585 / 35474815515). It was reachable only from
        # scripts/gate-suite.mjs, which no workflow calls — so the guard against CI referencing a
        # file that is not there was itself not in CI. A guard that does not run is a comment.
        run: node scripts/check-ci-references.mjs

      - name: Ledger is well-formed
        run: node scripts/gate-check.mjs --lint

      - name: Formatting drift (report only)
        # PINNED. `prettier@3` resolves the newest 3.x from npm on every run, including
        # every fork PR — unpinned remote code execution, in a workflow whose other two
        # toolchain installs are deliberately version-pinned so the supply chain is one
        # fewer thing to trust. Same reasoning, same treatment.
        run: npx --yes prettier@3.4.2 --check "apps/**/*.{ts,tsx,css,astro}" || echo "::warning::prettier reported formatting drift"

  # ------------------------------------------------------------- security ---
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still a
          # leaked secret, and a shallow clone would not see it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: The secret scanner's own tests
        # The scanner gained a suppression mechanism (scripts/known-fixtures.json) and had no
        # test of any kind. A suppression mechanism with no test is how a scanner becomes
        # decoration: the step below would still print a green tick with the register keyed by
        # path, which is the one design that lets a real key ride in beside a fixture.
        run: python3 scripts/test_secret_scan.py

      - name: Scan for secrets (a pull request's own commits; main and manual runs the full history)
        env:
          SECRET_SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || '' }}
        run: python3 scripts/secret-scan.py

      - name: Assert no environment files are tracked
        run: |
          set -euo pipefail
          for f in .env .env.local .dev.vars; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked by git"
              exit 1
            fi
          done
          echo "no tracked environment files"

      - name: Dependency audit
        # Advisory: a new upstream advisory should not block an unrelated PR,
        # but it must be visible in the run summary.
        run: pnpm audit --audit-level moderate || echo "::warning::pnpm audit reported advisories"
