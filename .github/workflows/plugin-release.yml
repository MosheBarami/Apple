name: Plugin release

# ===========================================================================
# WHAT THIS BUILDS: apps/apple-plugin, into apps/apple-plugin/release/apple-studio.rbxm.
# WHERE IT GOES: the Creator Store asset "Apple Studio", 107230158271368 (creator Shahar474).
#
# Retargeted 2026-09-22. Until then this job built `apps/plugin` — the legacy source, which compiles
# text received over HTTP into a ModuleScript and requires it (`apps/plugin/src/Ops.luau:521`) — and
# told a human to overwrite asset 132128477945417 "Golem", which Roblox removed. Both are retired:
# `apps/plugin` is kept only as test fixtures (see `apps/plugin/README.md`), and 132128477945417
# answers 404 on toolbox-service. Never publish to it. `docs/PLUGIN-RELEASE.md` is the runbook.
#
# The version is read from `apps/apple-plugin/src/Bridge.luau` (PLUGIN_VERSION / PLUGIN_PROTOCOL),
# the constant the plugin sends on every request, and the build is the same `build.mjs` a person
# runs locally and ci.yml runs on every PR: parse, rojo build, secret scan, then
# `apps/apple-plugin/scripts/verify-artifact.py` over the BUILT bytes.
# ===========================================================================

# ===========================================================================
# TWO WORKFLOWS SHARE THE WORD "BUILD". THEY ARE NOT THE SAME THING.
#
#   DEVELOPMENT (us, this file, and one irreducible human step)
#       source -> rojo build -> .rbxm -> tests + secret inspection
#         -> [HUMAN, in Roblox Studio] publish/update the Creator Store asset
#
#   USER (them, entirely inside Roblox)
#       Creator Store -> Get Plugin -> Studio Plugins tab -> Apple -> pair with a code -> build
#
# This workflow implements the first line and stops dead at the human step. It
# produces a verified artifact and never touches Roblox.
#
# ---------------------------------------------------------------------------
# WHY PUBLISHING IS NOT AUTOMATED. THIS IS NOT AN OMISSION.
#
# Open Cloud cannot update a Plugin asset. Two independent blockers, either one
# fatal on its own:
#
#   1. Plugin is not a supported asset type. The Open Cloud assets reference
#      states verbatim: "Supported asset types include Audio, Decals, Images,
#      Models, Meshes, and Videos." Plugin (asset type 38) is absent, and the
#      "Supported asset types and limits" table lists exactly Animation, Audio,
#      Decal/Image, Mesh, Model, Video. No Plugin row.
#
#   2. Even for supported types, content updates barely exist. The PATCH
#      reference: "Currently can only update the content body for Models." The
#      usage guide: "you can only update the asset content for .fbx files."
#
# A false lead to head off, because someone will find it: the OpenAPI spec's
# AssetQuota.assetType enum does contain PLUGIN. That is the QUOTA-LOOKUP API,
# not create/update. Open Cloud's own Asset.assetType is declared as an
# unenumerated string. The quota enum is not evidence that CI publishing works.
#
# Nor is there a back door. PATCH develop.roblox.com/v1/plugins/{id} exists and
# is documented as "Updates a plugin", but its request model accepts only name,
# description and commentsEnabled — metadata, no content — and it authenticates
# with a .ROBLOSECURITY cookie. Shipping a session cookie to CI to update a
# plugin's DESCRIPTION would trade the account for nothing. Do not do it.
#
# So every version bump requires a human in Roblox Studio:
#   Plugins -> Publish as Plugin -> "Overwrite an existing asset" -> Apple Studio (107230158271368)
# Keep the asset under a USER account. Group-owned plugin overwrite is a known
# broken path (DevForum 587851, acknowledged by staff, never resolved).
#
# DISTRIBUTION, MEASURED 2026-09-22: toolbox-service/v1/items/details for
# 107230158271368 answers 200 (published, purchasable, free) beside two listed
# controls that also answer 200 and the retired 132128477945417 that answers 404,
# and `STUDIO_PLUGIN_STORE_LIVE` in packages/shared is true. A publish can change
# that — the 09-19 upload was removed the same day — so re-probe after every one;
# the summary below prints the command.
#
# ---------------------------------------------------------------------------
# NO SECRETS, BY CONSTRUCTION.
#
# This job is given no repository secrets, matching ci.yml. A workflow with no
# credentials cannot leak them and cannot publish anything, which is exactly the
# property we want for a job whose output is a public artifact. Rojo and Luau are
# fetched from pinned upstream releases rather than third-party actions, for the
# same reason as in ci.yml: one fewer supply chain to trust.
# ===========================================================================

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What is this build for? (recorded in the summary)'
        required: false
        default: 'manual release candidate'

# Never on push, never on a tag, never on a schedule. A release artifact is
# produced when a human asks for one, so that the artifact list stays a record
# of intended releases rather than a log of every commit.

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.13.0'
  ROJO_VERSION: '7.7.0'
  LUAU_VERSION: '0.663'
  # The one Creator Store asset this plugin is published as. The literal lives in
  # packages/shared/src/index.ts (STUDIO_PLUGIN_ASSET_ID); the step below fails if
  # the two disagree, so this cannot quietly point somewhere else.
  STORE_ASSET_ID: '107230158271368'

jobs:
  release:
    name: Build, verify and record the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------ version --
      - name: Read the version the plugin declares about itself
        # The plugin cannot discover its own version at runtime — no member of
        # Plugin or StudioService exposes it — so this constant is the only
        # identity the artifact will ever have. Read it from the source rather
        # than from a workflow input, so the recorded version cannot disagree
        # with the bytes that ship.
        id: version
        run: |
          set -euo pipefail
          SRC=apps/apple-plugin/src/Bridge.luau
          VERSION=$(grep -oE '^local PLUGIN_VERSION = "[^"]+"' "$SRC" | head -1 | sed -E 's/.*"(.*)"/\1/')
          PROTOCOL=$(grep -oE '^local PLUGIN_PROTOCOL = "[0-9]+"' "$SRC" | head -1 | grep -oE '[0-9]+')
          if [ -z "$VERSION" ] || [ -z "$PROTOCOL" ]; then
            echo "::error::could not parse PLUGIN_VERSION/PLUGIN_PROTOCOL out of $SRC"
            exit 1
          fi
          # These values reach shell commands and a JSON manifest below, so they are
          # constrained to a charset that cannot carry quoting or substitution. A
          # version string is not a place for shell metacharacters.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$'; then
            echo "::error::PLUGIN_VERSION '$VERSION' is not a plain version string"
            exit 1
          fi
          if ! grep -qE "^export const STUDIO_PLUGIN_ASSET_ID = '${STORE_ASSET_ID}';" packages/shared/src/index.ts; then
            echo "::error::STORE_ASSET_ID ${STORE_ASSET_ID} is not STUDIO_PLUGIN_ASSET_ID in packages/shared/src/index.ts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "plugin version $VERSION, wire protocol $PROTOCOL, store asset $STORE_ASSET_ID"

      # ------------------------------------------------------ static checks --
      - name: Install Luau toolchain
        # luau-analyze parses the sources; luau runs the plugin's own Luau tests.
        run: |
          set -euo pipefail
          curl -fsSL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau-analyze" "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Parse every plugin source
        # Keyed on SyntaxError, not on exit code: valid Roblox code still exits
        # non-zero with "Unknown global 'game'" because no definitions file is
        # loaded. The script also refuses a require of a module that is not bundled,
        # and fails rather than skips when the analyzer is missing under CI.
        run: node apps/apple-plugin/scripts/syntax-check.mjs

      - name: Secret-inspection rules self-test
        # Run the scanner's own rules against known-positive and known-negative
        # fixtures BEFORE trusting its verdict on the artifact. A scanner whose
        # patterns have silently stopped matching reports every build as clean.
        run: python3 scripts/inspect-plugin-build.py --self-test

      - name: Test the plugin, and the worker contract it speaks
        # The plugin and the worker agree on a protocol number and a version
        # string across two files in two languages, and nothing but these suites
        # enforces that they still match (packages/evals/src/plugin-version.test.mjs).
        run: |
          pnpm --filter @apple/studio-plugin test
          pnpm --filter @golem/worker typecheck
          pnpm --filter @golem/evals test

      # ------------------------------------------------------------- build --
      - name: Install Rojo
        run: |
          set -euo pipefail
          curl -fsSL -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -q rojo.zip -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Rojo version
        run: rojo --version

      - name: Build the plugin and verify the built bytes
        # rojo build -> apps/apple-plugin/release/apple-studio.rbxm, then the
        # secret scan, then verify-artifact.py, which reads the BUILT bytes for every
        # capability the source claims. The legacy artifact once shipped with zero
        # GenerateModelAsync while its source had generation, and every test was green.
        run: node apps/apple-plugin/scripts/build.mjs

      # ------------------------------------------------- refuse to ship junk --
      - name: Inspect the built artifact for secrets, at the version being recorded
        # THE GATE. Runs against the .rbxm, not against the source, because the
        # source is not what ships. The scanner decompresses every chunk first:
        # .rbxm payloads are LZ4-compressed, so `strings | grep` finds none of
        # the script text and would certify a poisoned build as clean.
        #
        # --expect-version closes the loop between what we are about to record
        # and what is actually inside the bytes.
        env:
          EXPECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/inspect-plugin-build.py apps/apple-plugin/release/apple-studio.rbxm \
            --expect-version "$EXPECT_VERSION"

      # ------------------------------------------------------------ record --
      - name: Record version and checksum
        id: record
        # Values reach the shell as environment variables rather than as template
        # expansions, so nothing that lands in them can be executed.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROTOCOL: ${{ steps.version.outputs.protocol }}
          COMMIT: ${{ github.sha }}
          ROJO: ${{ env.ROJO_VERSION }}
        run: |
          set -euo pipefail
          ARTIFACT=apps/apple-plugin/release/apple-studio.rbxm
          SHA=$(sha256sum "$ARTIFACT" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ARTIFACT")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Built with jq so the values are JSON-encoded rather than string-pasted.
          jq -n \
            --arg version "$VERSION" \
            --argjson protocol "$PROTOCOL" \
            --arg sha256 "$SHA" \
            --argjson bytes "$SIZE" \
            --arg commit "$COMMIT" \
            --arg builtAt "$BUILT_AT" \
            --arg rojo "$ROJO" \
            --arg storeAssetId "$STORE_ASSET_ID" \
            '{$version, $protocol, $sha256, $bytes, $commit, $builtAt, $rojo, $storeAssetId,
              published: false,
              publishNote: "Publishing is a human step in Roblox Studio. Open Cloud cannot update a Plugin asset."}' \
            > apps/apple-plugin/release/apple-studio.manifest.json
          cat apps/apple-plugin/release/apple-studio.manifest.json

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: apple-studio-${{ steps.version.outputs.version }}
          path: |
            apps/apple-plugin/release/apple-studio.rbxm
            apps/apple-plugin/release/apple-studio.manifest.json
          if-no-files-found: error
          retention-days: 90

      # ------------------------------------------- hand off to the human ----
      - name: Publishing instructions
        # The workflow's last act is to tell a person what only a person can do.
        #
        # `reason` is free text supplied by whoever pressed the button, so it is
        # passed as an environment variable and never expanded into the script
        # body. A template expansion here would be a shell injection with a
        # convenient text box attached.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROTOCOL: ${{ steps.version.outputs.protocol }}
          SHA256: ${{ steps.record.outputs.sha256 }}
          COMMIT: ${{ github.sha }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          {
            echo "## Apple Studio plugin $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| wire protocol | \`$PROTOCOL\` |"
            echo "| sha256 | \`$SHA256\` |"
            echo "| commit | \`$COMMIT\` |"
            echo "| Creator Store asset | \`$STORE_ASSET_ID\` (Apple Studio) |"
            echo "| reason | $REASON |"
            echo "| published to Roblox | **no — see below** |"
            echo ""
            echo "### This build is NOT published. It cannot be, from here."
            echo ""
            echo "Open Cloud does not support Plugin assets: the assets API lists"
            echo "Audio, Decals, Images, Models, Meshes and Videos, and content"
            echo "updates are restricted to Models/.fbx even for those. The"
            echo "\`develop/v1/plugins\` PATCH endpoint updates metadata only and"
            echo "needs a session cookie. There is no supported automated path."
            echo ""
            echo "### To release it (human, in Roblox Studio)"
            echo ""
            echo "1. Download the \`apple-studio-$VERSION\` artifact."
            echo "2. Smoke-test it: put \`apple-studio.rbxm\` in your local Plugins folder, restart"
            echo "   Studio, pair with a code, allow edits, run one build. Remove the local file"
            echo "   afterwards so Studio does not load it beside the Creator Store copy."
            echo "3. Drag \`apple-studio.rbxm\` into Explorer, right-click it -> **Publish as Plugin**."
            echo "4. Choose **Overwrite an existing asset** and select **Apple Studio** (asset $STORE_ASSET_ID)."
            echo "   Creator must be **Me**, not a group — group overwrite is broken (DevForum 587851)."
            echo "   Never 132128477945417: that is the retired legacy asset and Roblox removed it."
            echo "5. Record the sha256 above against the published version."
            echo "6. Only once the store serves it (step below), set LATEST_PLUGIN_VERSION in"
            echo "   \`apps/worker/src/plugin-version.ts\` to \`$VERSION\`. Before that, it must keep"
            echo "   naming the version the store serves: it drives the \"update available\" notice."
            echo ""
            echo "### Then check the store still distributes it"
            echo ""
            echo "The 2026-09-19 upload was removed by moderation the same day, so a publish is"
            echo "not proof of distribution. Probe the asset beside a listed control (Rojo 7):"
            echo ""
            echo "    curl -s -w '\\n%{http_code}\\n' \\"
            echo "      'https://apis.roblox.com/toolbox-service/v1/items/details?assetIds=$STORE_ASSET_ID'"
            echo "    curl -s -o /dev/null -w '%{http_code}\\n' \\"
            echo "      'https://apis.roblox.com/toolbox-service/v1/items/details?assetIds=6415005344'"
            echo ""
            echo "200 for both means listed; read \`updatedUtc\` and \`scriptCount\` in the first"
            echo "response to confirm it is THIS build rather than the previous one. A 404 means"
            echo "it is not installable by anyone: flip \`STUDIO_PLUGIN_STORE_LIVE\` in"
            echo "\`packages/shared/src/index.ts\` back to false and record the notice verbatim."
            echo ""
            echo "### After users have it"
            echo ""
            echo "Updates are **manual**: Studio's Manage Plugins window has per-plugin"
            echo "Update buttons a user must click. There is no push channel and no"
            echo "auto-update. Assume a permanent long tail on old versions, and keep"
            echo "the worker serving them — see apps/worker/src/plugin-version.ts."
          } >> "$GITHUB_STEP_SUMMARY"
