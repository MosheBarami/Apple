packages:
  - apps/*
  - packages/*
  # apps/www is the new front end (planning/WEB-REBUILD.md): its own lockfile and a hoisted install, which OpenNext needs.
  - '!apps/www'
overrides:
  # Dependabot 2026-10-03: transitive copies (ajv's fast-uri, mermaid's dompurify, astro's devalue, unifont's undici 8) held to patched releases.
  fast-uri: '>=3.1.8 <4'
  dompurify: '>=3.4.16 <4'
  devalue: '>=5.9.3 <6'
  undici@8: '>=8.10.2 <9'
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  # Pulled in by Flue (apps/studio); their install scripts are not needed.
  '@google/genai': false
  core-js-pure: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260830.1'
  - '@ai-sdk/provider@4.0.25'
