<script>
  // Records any runtime error on <html data-cc-errors> so a headless check (--dump-dom) can see it.
  (function () {
    var add = function (m) { var d = document.documentElement; d.setAttribute('data-cc-errors', ((d.getAttribute('data-cc-errors') || '') + ' | ' + m).slice(0, 2000)); };
    window.addEventListener('error', function (e) { add('error: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown')); }, true);
    window.addEventListener('unhandledrejection', function (e) { add('rejection: ' + (e.reason && e.reason.message || e.reason)); });
  })();
</script>
