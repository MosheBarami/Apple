<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Apple HQ</title>
<script>
  // Records any runtime error on <html data-cc-errors> so a headless check (--dump-dom) can see it.
  (function () {
    var add = function (m) { var d = document.documentElement; d.setAttribute('data-cc-errors', ((d.getAttribute('data-cc-errors') || '') + ' | ' + m).slice(0, 2000)); };
    window.addEventListener('error', function (e) { add('error: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown')); }, true);
    window.addEventListener('unhandledrejection', function (e) { add('rejection: ' + (e.reason && e.reason.message || e.reason)); });
    try { if (localStorage.getItem('hq-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/control/styles.css">
</head>
<body>
<a class="skip" href="#page">דילוג לתוכן</a>
<div class="app">
  <aside class="side" aria-label="ניווט">
    <a class="brand" href="#/hq" aria-label="Apple HQ, למרכז הפיקוד">
      <svg class="brand-m" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M5 24 12 5 19 14 27 8 21 27 13 18Z" fill="currentColor" fill-opacity=".1"/><path d="m5 24 7-19 7 9 8-6-6 19-8-9-8 6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m12 5 1 13 6-4 2 13" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <span><b>Apple HQ</b><small>מרכז הפיקוד של הריפו</small></span>
    </a>
    <nav id="nav" class="nav" aria-label="ניווט ראשי"></nav>
    <p class="side-f"><kbd>⌘</kbd><kbd>K</kbd> חיפוש ופעולות</p>
  </aside>
  <div id="scrim" class="scrim" aria-hidden="true"></div>
  <div class="main">
    <header class="top">
      <button id="menu-btn" class="ib menu-btn" aria-controls="nav" aria-expanded="false" aria-label="תפריט"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="pal-btn" class="pal-btn" aria-label="חיפוש דף או פעולה (Cmd+K)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg><span>לאן לקפוץ, מה לעשות…</span><kbd>⌘K</kbd></button>
      <div class="top-s">
        <span id="live" class="live" data-state="wait" role="status" aria-live="off"><i class="live-d" aria-hidden="true"></i><span id="live-t">מתחבר…</span></span>
        <button id="pause" class="ib" aria-pressed="false" aria-label="להשהות את העדכון האוטומטי"></button>
        <button id="fresh" class="ib" aria-label="רענון עכשיו מהמקור"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4.5V11h-6.5"/></svg></button>
        <button id="dry" class="dry" aria-pressed="false" title="מצב ניסוי: כל פעולה מראה מה היה נשלח, בלי לשלוח"><span class="sw" aria-hidden="true"><i></i></span><span class="dry-l">מצב ניסוי</span></button>
        <button id="theme" class="ib" aria-label="מעבר למצב בהיר"></button>
        <span class="mock-pill" role="status">דמו: נתונים מזויפים</span>
      </div>
    </header>
    <main id="page" class="page" tabindex="-1" aria-labelledby="ptitle">
      <noscript><p class="fail fail-bad">כדי להשתמש בלוח הבקרה צריך להפעיל JavaScript בדפדפן.</p></noscript>
    </main>
  </div>
</div>
<dialog id="modal" class="modal" aria-modal="true"></dialog>
<dialog id="palette" class="palette" aria-modal="true" aria-label="חיפוש ופעולות"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/control/app.js"></script>
</body>
</html>
