<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Apple">
  <!--
    The flat cut of the product mark, for small sizes.

    The supplied artwork is a 1254px glossy 3D render and resolves to ~136 distinct colours at
    16px, which a favicon cannot carry. This keeps only what survives: the angular A, the orbital
    ring, and the centre spark — the three things that identify the mark at a glance. Two stops of
    the measured hue sweep (cyan 180deg -> azure 210deg -> violet 265deg) stand in for the full
    gradient; more stops are invisible at this size and only cost bytes.
  -->
  <defs>
    <linearGradient id="a" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".5" stop-color="#0080F0"/>
      <stop offset="1" stop-color="#7B4DF0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#07080F"/>
  <!-- the A: two bladed strokes meeting at an apex -->
  <path d="M24 9 L37 39 L31.6 39 L24 20.4 L16.4 39 L11 39 Z" fill="url(#a)"/>
  <!-- orbital ring, tilted -->
  <ellipse cx="24" cy="28" rx="16" ry="6.4" transform="rotate(-18 24 28)"
           fill="none" stroke="url(#a)" stroke-width="2.1" opacity=".9"/>
  <!-- centre spark: a four-point star -->
  <path d="M24 22.2 L25.5 26.3 L29.6 27.8 L25.5 29.3 L24 33.4 L22.5 29.3 L18.4 27.8 L22.5 26.3 Z"
        fill="#FEFEFE"/>
</svg>
