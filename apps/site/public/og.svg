<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#17150F"/>
      <stop offset="1" stop-color="#100E0C"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.76" cy="0.46" r="0.46">
      <stop offset="0" stop-color="#FF9A4D" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FF9A4D" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9A8F7F"/>
      <stop offset="1" stop-color="#514839"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9A4D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#lamp)"/>

  <!-- drawing-sheet rails -->
  <g stroke="#F3EFE6" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="10 12">
    <path d="M56 0V630M1144 0V630"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(96 92)">
    <path d="M4 0h26a4 4 0 0 1 4 4v22.6a4.4 4.4 0 0 1-2.3 3.9L20.1 36.6a4.3 4.3 0 0 1-4.2 0L4.3 30.5A4.4 4.4 0 0 1 2 26.6V4a4 4 0 0 1 4-4Z"
