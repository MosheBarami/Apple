    <path d="M0 17.6h11l7 5 7-5h11" stroke="#100E0C" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <rect x="5.6" y="22.6" width="7.6" height="4" rx="1.4" fill="#FF9A4D"/>
