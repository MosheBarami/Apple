  <!-- headline -->
  <text x="96" y="272" font-family="Georgia, 'Iowan Old Style', serif" font-size="88" font-weight="700" fill="#F3EFE6" letter-spacing="-3">Describe it.</text>
  <text x="96" y="372" font-family="Georgia, 'Iowan Old Style', serif" font-size="88" font-weight="700" fill="#FF9A4D" letter-spacing="-3">Golem builds it.</text>

  <text x="96" y="436" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A89F90">The AI builder for Roblox Studio — real scripts, real</text>
  <text x="96" y="472" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A89F90">instances, native undo, verified by running your game.</text>

  <text x="96" y="546" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#7F7869" letter-spacing="1.4">60 FREE SPARKS A DAY  ·  NO CARD, EVER</text>

