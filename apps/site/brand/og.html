<!doctype html>
<!--
  THE SOURCE OF apps/site/public/og.png. Rendered by scripts/make-brand-assets.mjs.

  Why an HTML source rasterised to PNG: og:image wants a raster (Facebook, X, LinkedIn and Slack
  document PNG, JPEG, GIF and WEBP, not SVG), and a PNG is opaque to review, so this file is the
  reviewable artefact and the script turns it into the shipped one.

  No font is fetched. The type is the system font stack and every colour is a token from
  packages/design/src/web/tokens.css, linked below by path, so the card follows the product when the
  palette moves. The generator fails the run if this page requests anything but a file on disk.

  Kept deliberately narrow: no claim, no price, no adoption. A share card is seen by people who have
  not opened the page yet, so everything on it has to be true without the page to qualify it.
-->
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../packages/design/src/web/tokens.css" />
<style>
  * {
    box-sizing: border-box;
    margin: 0;
  }

  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .mark {
    flex: none;
    color: var(--accent);
  }

  .wordmark {
    font-size: 30px;
    font-weight: var(--weight-semibold);
    letter-spacing: -0.02em;
  }

  h1 {
    font-size: 88px;
    font-weight: var(--weight-semibold);
    line-height: 0.98;
    letter-spacing: -0.035em;
  }

  .l1,
  .l2 {
    display: block;
  }

  .l2 {
    color: var(--accent);
  }

  .sub {
    margin-top: 28px;
    max-width: 32ch;
    font-size: 26px;
    line-height: 1.45;
    color: var(--muted);
  }

  footer {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    font-size: 22px;
    color: var(--muted);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: var(--r-pill);
    background: var(--accent);
    flex: none;
  }

  .sep {
    color: var(--faint);
  }
</style>

<header class="row">
  <svg class="mark" width="44" height="44" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
    <path fill-rule="evenodd" d="M12 3H27.8Q29 3 29 4.2V20A9 9 0 0 1 20 29H12A9 9 0 0 1 3 20V12A9 9 0 0 1 12 3ZM20 17a4.6 4.6 0 1 0-9.2 0 4.6 4.6 0 0 0 9.2 0Z"></path>
  </svg>
  <span class="wordmark">StudPilot</span>
</header>

<main>
  <h1>
    <span class="l1">Describe a</span>
    <span class="l1">Roblox game.</span>
    <span class="l2">StudPilot builds it.</span>
  </h1>
  <p class="sub">The parts, the scripts, the systems, straight into the place you have open in Studio.</p>
</main>

<footer>
  <span class="dot"></span>
  <span>Works inside Roblox Studio</span>
  <span class="sep">·</span>
  <span>Free to start</span>
</footer>
