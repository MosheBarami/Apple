<!doctype html>
<!--
  THE SOURCE OF apps/site/public/og.png. Rendered by scripts/make-brand-assets.mjs.

  Why an HTML source rasterised to PNG: og:image wants a raster (the major consumers of Open Graph
  document PNG, JPEG, GIF and WEBP, and do not list SVG), and a diff of a PNG says "binary files
  differ" and nothing about what changed. This file is the reviewable artefact.

  REBUILT 2026-10-02 (phase 6, "Ember Rail"). Self-contained on purpose: no webfont, no network, no
  stylesheet from another origin. The type is the system stack the site itself uses, the logo is the
  inline lockup (same drawing as apps/site/public/logo-dark.svg) and every colour is a token value
  from apps/site/src/styles/apple-minimal.css, dark theme. The previous card loaded Archivo, Figtree
  and Geist Mono from fonts.googleapis.com and painted a blue gradient; both are gone.

  Kept deliberately narrow: no claim, no price, no adoption. A share card is seen by people who
  have not opened the page yet, so everything on it has to be true without the page to qualify it.
-->
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }

  html,
  body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px 56px 112px;
    background: #0a0c10;
    color: #f3f5f8;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The Rail: a one-pixel line down the inline-start margin with square nodes, the structure the
     site is built on. The last node is the lit one. */
  .rail { position: absolute; inset-block: 64px 56px; inset-inline-start: 72px; width: 1px; background: #3a4150; }
  .node { position: absolute; inset-inline-start: -5px; width: 11px; height: 11px; background: #0a0c10; border: 1px solid #6b7587; border-radius: 2px; }
  .node.lit { background: #ff8a4c; border-color: #ff8a4c; }

  .logo { width: 188px; height: auto; display: block; color: #f3f5f8; }

  h1 {
    font-size: 84px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.03em;
  }

  .ember { color: #ff8a4c; }

  .sub {
    margin-top: 28px;
    max-width: 34ch;
    font-size: 26px;
    line-height: 1.45;
    color: #c3c9d4;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 20px;
    color: #9aa3b2;
  }

  .stud { width: 12px; height: 9px; border-radius: 3px; background: #ff8a4c; flex: none; }
  .sep { color: #6b7587; }
</style>

<div class="rail">
  <span class="node" style="top: 0"></span>
  <span class="node" style="top: 232px"></span>
  <span class="node lit" style="top: 440px"></span>
</div>

<header>
  <svg class="logo" viewBox="0 0 128 36" role="img" aria-label="Apple" fill="none">
    <g fill="#ff8a4c">
      <path fill-rule="evenodd" d="M10 11H22A7 7 0 0 1 29 18V26A7 7 0 0 1 22 33H10A7 7 0 0 1 3 26V18A7 7 0 0 1 10 11ZM9.4 16.2 19.6 22 9.4 27.8 7.8 25.2 13.6 22 7.8 18.8ZM21 26.4H25.6A1.2 1.2 0 0 1 25.6 28.8H21A1.2 1.2 0 0 1 21 26.4Z"/>
      <rect x="7" y="6.5" width="7" height="5.5" rx="2"/>
      <rect x="18" y="6.5" width="7" height="5.5" rx="2"/>
    </g>
    <g transform="translate(-4 0)" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 27 52 9 60 27M47 21H57"/>
      <path d="M69 15V33"/><circle cx="75" cy="21" r="6"/>
      <path d="M89 15V33"/><circle cx="95" cy="21" r="6"/>
      <path d="M109 8V27"/>
      <path d="M116 21H128A6 6 0 1 0 126.2 25.3"/>
    </g>
  </svg>
</header>

<main>
  <h1>Describe a Roblox game.<br /><span class="ember">Apple builds it.</span></h1>
  <p class="sub">The parts, the scripts, the systems — straight into the place you have open in Studio.</p>
</main>

<footer>
  <span class="stud"></span>
  <span>Works inside Roblox Studio</span>
  <span class="sep">·</span>
  <span>Free to start</span>
</footer>
