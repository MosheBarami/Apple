<!doctype html>
<!--
  THE SOURCE OF apps/site/public/og.png. Rendered by scripts/make-brand-assets.mjs.

  Why an HTML source rasterised to PNG: og:image wants a raster (Facebook, X, LinkedIn and Slack
  document PNG, JPEG, GIF and WEBP, not SVG), and a PNG is opaque to review, so this file is the
  reviewable artefact and the script turns it into the shipped one.

  No font is fetched. The type is the system font stack and every colour is a token from
  packages/design/src/web/tokens.css, linked below by path, so the card follows the product when the
  palette moves. The generator fails the run if this page requests anything but a file on disk.

  Kept deliberately narrow: no result, no price, no adoption, no whole game. A share card is seen by people who have
  not opened the page yet, so everything on it has to be true without the page to qualify it. It says the plan's promise
  (planning/STUDPILOT-FINAL-PLAN.md section 1) AS THE BAR BEING BUILT TO, under a Beta label, and nothing about where it
  works: new customers cannot get the Studio plugin yet, so the card never says it "works inside Roblox Studio".
  apps/site/tests/share-surfaces.test.mjs and scripts/check-copy.mjs read this file.
-->
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../packages/design/src/web/tokens.css" />
<style>
  * {
    box-sizing: border-box;
    margin: 0;
  }

  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .mark {
    flex: none;
    color: var(--accent);
  }

  .wordmark {
    font-size: 30px;
    font-weight: var(--weight-semibold);
    letter-spacing: -0.02em;
  }

  .beta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-left: 6px;
    padding: 7px 16px;
    border: 1px solid var(--accent-ring);
    border-radius: var(--r-pill);
    background: var(--accent-wash);
    color: var(--accent-strong);
    font-size: 20px;
    font-weight: var(--weight-semibold);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .kicker {
    margin-bottom: 22px;
    color: var(--accent-strong);
    font-size: 22px;
    font-weight: var(--weight-semibold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1 {
    max-width: 19em;
    text-wrap: balance;
    /* 56px: the same cap scripts/check-copy.mjs holds every display size on the site to, which now reads this file too. */
    font-size: 56px;
    font-weight: var(--weight-semibold);
    line-height: 1.06;
    letter-spacing: -0.03em;
  }

  .sub {
    margin-top: 26px;
    max-width: 36ch;
    font-size: 26px;
    line-height: 1.45;
    color: var(--muted);
  }

  footer {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    font-size: 22px;
    color: var(--muted);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: var(--r-pill);
    background: var(--accent);
    flex: none;
  }

  .sep {
    color: var(--faint);
  }
</style>

<header class="row">
  <svg class="mark" width="44" height="44" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
    <path fill-rule="evenodd" d="M12 3H27.8Q29 3 29 4.2V20A9 9 0 0 1 20 29H12A9 9 0 0 1 3 20V12A9 9 0 0 1 12 3ZM20 17a4.6 4.6 0 1 0-9.2 0 4.6 4.6 0 0 0 9.2 0Z"></path>
  </svg>
  <span class="wordmark">StudPilot</span>
  <span class="beta">Beta</span>
</header>

<main>
  <p class="kicker">The bar we are building to</p>
  <h1>Ask for any piece. It looks pro, it works, and we never claim what we didn't prove.</h1>
  <p class="sub">An AI co-pilot for Roblox Studio.</p>
</main>

<footer>
  <span class="dot"></span>
  <span>Free while in beta</span>
  <span class="sep">·</span>
  <span>studpilot.app</span>
</footer>
