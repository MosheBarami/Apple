<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Apple — build Roblox games inside Studio</title>
    <meta name="description" content="Apple writes the scripts, builds the parts and wires the systems inside the Roblox place you already have open in Studio." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c10'/%3E%3Cg transform='translate(3.2 .2) scale(.8)' fill='%23ff8a4c'%3E%3Cpath fill-rule='evenodd' d='M10 11H22A7 7 0 0 1 29 18V26A7 7 0 0 1 22 33H10A7 7 0 0 1 3 26V18A7 7 0 0 1 10 11ZM9.4 16.2 19.6 22 9.4 27.8 7.8 25.2 13.6 22 7.8 18.8Z'/%3E%3Crect x='7' y='6.5' width='7' height='5.5' rx='2'/%3E%3Crect x='18' y='6.5' width='7' height='5.5' rx='2'/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0a0c10" />
    <script>
      // Paint the right theme before first frame so there is never a light flash.
      try {
        var p = JSON.parse(localStorage.getItem('apple.prefs.v1') || 'null');
        var t = p ? p.appearance : localStorage.getItem('apple-theme');
        if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === 'light') m.setAttribute('content', '#f7f8fa');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
