<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>StudPilot — build Roblox games inside Studio</title>
    <meta name="description" content="StudPilot writes the scripts, builds the parts and wires the systems inside the Roblox place you already have open in Studio." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' role='img' aria-label='StudPilot'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0d'/%3E%3Cpath transform='translate(4.16 4.16) scale(0.74)' fill='%23a67cff' fill-rule='evenodd' d='M12 3H27.8Q29 3 29 4.2V20A9 9 0 0 1 20 29H12A9 9 0 0 1 3 20V12A9 9 0 0 1 12 3ZM20 17a4.6 4.6 0 1 0-9.2 0 4.6 4.6 0 0 0 9.2 0Z'/%3E%3C/svg%3E"
    />
    <script>
      // Paint the right theme before first frame so there is never a light flash.
      try {
        var p = JSON.parse(localStorage.getItem('apple.prefs.v1') || 'null');
        var t = p ? p.appearance : localStorage.getItem('apple-theme');
        if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
