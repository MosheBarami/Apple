<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Apple — build Roblox games inside Studio</title>
    <meta name="description" content="Apple writes the scripts, builds the parts and wires the systems inside the Roblox place you already have open in Studio." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080808'/%3E%3Cpath d='m5 24 7-19 7 9 8-6-6 19-8-9-8 6Zm7-19 1 13 6-4 2 13' fill='none' stroke='%23eeeeee' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Paint the right theme before first frame so there is never a light flash.
      try {
        var p = JSON.parse(localStorage.getItem('apple.prefs.v1') || 'null');
        var t = p ? p.appearance : localStorage.getItem('apple-theme');
        if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
