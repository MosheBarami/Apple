# Apple v30 — written by src/train-forever.mjs; do not hand-edit (the next version derives from the best).
#
# Lever: game-logic-x2 — one change relative to the best at the time, v29 (lora-apple-v29.yaml).
# Why: v4's miss analysis: the model copies what the modules LOOK like, not what they COMPUTE. 69
# logic rows against 183 trajectory rows; doubling the logic rows shifts the mix toward the checks
# without new data.
# Change: data:{"op":"upweight","select":"game-logic","factor":2}
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "runs/forever/data-v30"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true
max_seq_length: 2048
iters: 400
learning_rate: 1.0e-4
val_batches: -1
steps_per_report: 10
steps_per_eval: 25
save_every: 25
adapter_path: "adapters/apple-v30"
