# Apple v8 — written by src/train-forever.mjs; do not hand-edit (the next version derives from the best).
#
# Lever: finish-x3 — one change relative to the best at the time, v5 (lora-apple-v5.yaml).
# Why: v5 finish fell to 3/7 from v4's 6/7: it calls invented tools where it should stop and report.
# Only 35 of 252 train rows are wrap-up (prose) turns; tripling them targets the regression
# directly.
# Change: data:{"op":"upweight","select":"finish","factor":3}
# SEGMENT 1: resumed after a Metal watchdog death, from iter 50
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "runs/forever/data-v8"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true
max_seq_length: 2048
iters: 350
learning_rate: 5.0e-5
val_batches: -1
steps_per_report: 10
steps_per_eval: 25
save_every: 25
adapter_path: "adapters/apple-v8-seg"
resume_adapter_file: "adapters/apple-v8/0000050_adapters.safetensors"
