# Apple v12 — written by src/train-forever.mjs; do not hand-edit (the next version derives from the best).
#
# Lever: cosine-lr — one change relative to the best at the time, v5 (lora-apple-v5.yaml).
# Why: Both runs overfit after a mid-run minimum (v4 at 100, v5 at 225) at a constant lr. A short
# warmup plus cosine decay to lr/10 lowers the late-run step size where the val curve turned.
# Change: lr_schedule="cosine"
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "mlxdata-apple-v5"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true
max_seq_length: 2048
iters: 400
learning_rate: 5.0e-5
val_batches: -1
steps_per_report: 10
steps_per_eval: 25
save_every: 25
adapter_path: "adapters/apple-v12"
lr_schedule: {"name":"cosine_decay","warmup":5,"arguments":[0.00005,100,0.000005]}
