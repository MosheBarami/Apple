# Apple v34 — written by src/train-forever.mjs; do not hand-edit (the next version derives from the best).
#
# Lever: dropout-0.05 — one change relative to the best at the time, v29 (lora-apple-v29.yaml).
# Why: 252 rows at ~6 epochs overfit (val turns mid-run in v4 and v5). LoRA dropout 0.05 is the
# cheapest regulariser that changes nothing else.
# Change: lora_parameters.dropout=0.05
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "runs/forever/data-v22"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true
max_seq_length: 2048
iters: 400
learning_rate: 1.0e-4
val_batches: -1
steps_per_report: 10
steps_per_eval: 25
save_every: 25
adapter_path: "adapters/apple-v34"
lora_parameters: {"rank":8,"dropout":0.05,"scale":20}
