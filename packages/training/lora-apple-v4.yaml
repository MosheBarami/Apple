# Apple v4 — the first run on data this repository can regenerate and audit.
#
# v1 and v2 were Qwen3-4B, which no Workers AI base can serve. v3 moved to Llama-3.2-3B and that
# choice is now PROVEN rather than argued: adapter fb2605c8 is live on
# @cf/meta/llama-3.2-3b-instruct and observed changing the output against a deterministic base,
# with an unknown lora id refused. See docs/evidence/lora-serving-verified-2026-09-19.md. The same
# document records that glm-4.7-flash, glm-5.3-flash and qwen3-30b — the three models the product
# actually routes to — answer 5005 "LoRA unsupported", so this adapter can only ever be an ADDED
# lane, never a replacement for the main one.
#
# WHAT CHANGED IS THE DATA, WHICH IS THE WHOLE POINT. v3 trained on `mlxdata-llama`: 404 harvested
# rows, 85.6% of them referencing globals that were never in scope, 0 tool trajectories, and the
# repo's own auditor calling it NOT_READY_FOR_PRODUCT_SFT. Nothing in the repository even wrote
# that directory. The served v3 adapter answered a Luau request with an empty function body
# followed by "Write the corre" — it had learned to reproduce the instruction suffix that ends
# every harvested row instead of learning Luau, and was measurably worse than the base at the
# product's job.
#
# `mlxdata-apple-v4` is built by `src/build-mlx-dataset.mjs` from committed, verified sources:
# 233 rows, 110 families, 233/233 usable, 0.0% context-dependent, 153 tool trajectories, 0
# harvested rows, 0 evaluation leakage. Verdict READY_FOR_PRODUCT_SFT.
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "mlxdata-apple-v4"
fine_tune_type: lora
optimizer: adamw

# rank 8, not higher: Cloudflare's documented adapter limit is r <= 8 for the older path and 32
# for the newer, and 8 is the value that needs no exception. v2 already showed the bottleneck was
# the dataset rather than adapter capacity, and that diagnosis is what this run tests.
num_layers: 16

# batch_size 1, not 2, and the effective batch held at 4 by accumulation.
#
# The first attempt at batch_size 2 died on
# `[METAL] Command buffer execution failed: Impacting Interactivity` — macOS killing a GPU command
# buffer that ran long enough to threaten UI responsiveness. That is a watchdog, not an
# out-of-memory: the fix is a smaller unit of work per kernel dispatch, not a smaller model. The
# gradient the optimiser sees is unchanged, because 1x4 and 2x2 accumulate to the same thing.
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true

# MEASURED, NOT GUESSED. Tokenised with the base's own chat template: min 163, median 357, p90 609,
# max 979. 1024 truncates zero rows.
#
# The first measurement of this said every row was 2 tokens long. `apply_chat_template(...,
# tokenize=True)` returns a BatchEncoding, `len()` of which is the number of KEYS — and
# `isinstance(x, dict)` is False for it, so the guard meant to catch that missed. It happened to
# report "0 rows truncate", which is the correct answer, reached by an instrument that had not
# looked at the data. A broken measurement agreeing with the truth is still a broken measurement.
max_seq_length: 1024

# 187 training rows at an effective batch of 4 is ~47 steps an epoch, so this is ~6 epochs.
# Overfitting is the real risk at this size, which is why the validation interval is tight and
# checkpoints are kept: the run picks the best val loss rather than the last step.
iters: 300
learning_rate: 5.0e-5
val_batches: 12
steps_per_report: 10
steps_per_eval: 25
save_every: 50
adapter_path: "adapters/apple-v4"
