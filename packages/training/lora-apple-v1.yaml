# Apple (fast tier) — LoRA v1 on Qwen3-4B-Instruct-2507 (4-bit / QLoRA).
#
# rank 8 is DELIBERATE, not a default: Cloudflare Workers AI accepts custom LoRA adapters only at
# r <= 8 (up to 32). Training at 8 keeps the hosted-serving path open. If we later commit to
# local-only serving, rank can rise.
#
# mask_prompt: the loss is computed on the ASSISTANT turn only. Without it the model spends
# capacity learning to reproduce instructions, which is not the behaviour we are buying.
model: "mlx-community/Qwen3-4B-Instruct-2507-4bit"
train: true
data: "mlxdata"
fine_tune_type: lora
optimizer: adamw
mask_prompt: true
num_layers: 16
batch_size: 4
iters: 250          # 327 examples / bs 4 = ~82 steps per epoch -> ~3 epochs
learning_rate: 1.0e-4
max_seq_length: 1024   # covers p99 (931); max is 1078
val_batches: 10
steps_per_report: 10
steps_per_eval: 50
save_every: 50
adapter_path: "adapters/apple-v1"
seed: 20260914
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
