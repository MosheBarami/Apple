# Apple v32 — written by src/train-forever.mjs; do not hand-edit (the next version derives from the best).
#
# Lever: layers-all — one change relative to the best at the time, v29 (lora-apple-v29.yaml).
# Why: v5 adapts only the last 16 of 28 layers. Computing the right arithmetic (the game-logic gap)
# may need the earlier layers; rank-8 on all 28 is still ~49MB, well under the 300MB serving cap.
# Change: num_layers=-1
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "runs/forever/data-v22"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: -1
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true
max_seq_length: 2048
iters: 400
learning_rate: 1.0e-4
val_batches: -1
steps_per_report: 10
steps_per_eval: 25
save_every: 25
adapter_path: "adapters/apple-v32"
