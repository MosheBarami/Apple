# Apple v29 — written by src/train-forever.mjs; do not hand-edit (the next version derives from the best).
#
# Lever: lr-1e-4 — one change relative to the best at the time, v22 (lora-apple-v22.yaml).
# Why: Game logic has not moved at 5e-5 in two runs (0/8, 0/8). A larger step tests whether the
# logic track is under-trained rather than out of reach; best-val selection guards against the
# overshoot.
# Change: learning_rate=0.0001
model: "unsloth/Llama-3.2-3B-Instruct"
train: true
data: "runs/forever/data-v22"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true
max_seq_length: 2048
iters: 400
learning_rate: 1.0e-4
val_batches: -1
steps_per_report: 10
steps_per_eval: 25
save_every: 25
adapter_path: "adapters/apple-v29"
